<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; script-src 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ESUS — uruchamianie</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #171b21; color: #e8edf5; font: 13px/1.5 "Segoe UI", Arial, sans-serif; -webkit-app-region: drag; }
    .splash { height: 100%; display: flex; flex-direction: column; border: 1px solid #303741; }
    .topbar { height: 32px; flex-shrink: 0; padding: 7px 16px; background: #11151b; border-bottom: 1px solid #303741; color: #9ca9bc; font-size: 11px; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px 32px; }
    .logo { display: block; width: 152px; height: auto; max-height: 48px; object-fit: contain; object-position: left center; margin-bottom: 19px; }
    h1 { margin: 0; font-size: 17px; font-weight: 500; }
    .subtitle { margin: 5px 0 0; font-size: 12px; color: #a4afbf; }
    .status { min-height: 49px; display: flex; align-items: center; gap: 10px; padding: 13px 18px; background: #1d232c; border-top: 1px solid #303741; color: #bdc9d9; font-size: 12px; }
    .spinner { width: 14px; height: 14px; flex: 0 0 14px; border: 2px solid #3a4658; border-top-color: #82b4ff; border-radius: 50%; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <div class="splash">
    <div class="topbar">ESUS · Generator wyceny</div>
    <main>
      <img src="./assets/logo_1_big_wh.png" alt="ESUS IT" class="logo" draggable="false" />
      <h1>Uruchamianie aplikacji</h1>
      <p class="subtitle">Przygotowywanie obszaru roboczego…</p>
    </main>
    <div class="status" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span>Ładowanie aplikacji…</span>
    </div>
  </div>
</body>
</html>
